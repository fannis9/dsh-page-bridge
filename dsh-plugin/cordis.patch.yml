# dsh-page-bridge — profile bundle patch.
#
# Mounts the DSH MCP client against page-bridge/mcp-server.mjs, which publishes the
# user's *real* Chrome tab as `mcp__page-bridge__*` tools in every session.
#
# Requirements: the "DSH Page Bridge" Chrome extension loaded (chrome://extensions →
# developer mode → load unpacked → .../page-bridge/extension). The bridge process itself
# is started on demand by the MCP server and exits by itself when idle.
#
# Paths below are absolute; adjust them if this checkout moves.
- insert:
    - id: page-bridge-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        transport: stdio
        # Public tool namespace becomes mcp__page-bridge__<tool>
        serverName: page-bridge
        command: "C:\\Users\\Cypress\\.dsh\\dsh-runtimes\\dsh-primary-runtime\\dependencies\\node\\bin\\node.exe"
        args:
          - "E:\\dsh\\page-bridge\\mcp-server.mjs"
        # A missing/stopped bridge must never block session creation.
        failOnStartupError: false
        reconnect:
          enabled: true
