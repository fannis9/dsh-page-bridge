name: tests

# 这套自检**不需要浏览器**：快照算法探针与真实浏览器端到端测试不在这里跑
# （前者要 Chromium，后者需要 --load-extension，官方 Chrome 137+ / Edge 154 已移除）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  browser-free:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 语法检查（全部 .mjs / .js）
        run: |
          # 与本地 `npm run check:all` 共用同一份实现（dev/check-syntax.mjs），避免两边规则漂移：
          # 之前 CI 用 git ls-files 全扫、本地只查 8 个入口，于是 page-op 片段让 CI 一进来就红。
          npm run check:all

      - name: 权限策略单测（26 个断言，含后缀伪装用例）
        run: node dev/grant-policy-test.mjs

      - name: service worker 状态机（假 chrome API，11 个场景 + 提权守卫 + origin 隔离）
        run: node dev/sw-load-test.mjs

      - name: PAGE_OP region 结构护栏
        run: node dev/page-op-regions-test.mjs

      - name: 本地控制面能力令牌（HTTP/WS 认证 + relay 失败关闭）
        run: node dev/bridge-auth-test.mjs

      - name: 运行期日志轮转
        run: node dev/log-rotation-test.mjs

      - name: WebSocket 畸形帧 fuzz
        run: node dev/ws-fuzz-test.mjs

      - name: CLI 错误处理（text/html selector 失败须非零退出且不打印空内容）
        run: npm run test:cli-errors

      - name: 中英双版文档一致性（代码块逐字节 / 行内代码 / 小节 / 链接 / 互链）
        run: npm run test:docs-parity

      - name: 命令队列 / 实例路由 / WS 帧上限
        run: node dev/bridge-queue-test.mjs

      - name: native messaging 帧往返（host 模式 + relay 模式）
        run: node dev/native-framing-test.mjs

      - name: 扩展 ID 推导（Chromium 算法，Chrome/Edge 一致性）
        run: node dev/extension-id-test.mjs

      - name: MCP 层冒烟（自带桥接 + 假扩展，隔离端口 8798）
        run: node dev/smoke-snapshot.mjs

      - name: MCP 工具清单
        run: node smoke-mcp.mjs
