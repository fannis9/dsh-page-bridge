name: browser-e2e

# Real-browser coverage is intentionally separate from the fast browser-free job.
# It downloads Playwright's pinned Chromium and runs daily plus on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

jobs:
  chromium:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright runtime and bundled Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Register Chrome native host
        run: node register-host.mjs register --browser chrome

      - name: Run browser fixture tests
        run: npm run test:browser:fixtures

      - name: Run bundled Chromium native messaging E2E
        env:
          DSH_USE_BUNDLED_CHROMIUM: '1'
        run: npm run test:browser:native -- --browser chrome

      - name: Remove Chrome native host registration
        if: always()
        run: node register-host.mjs unregister --browser chrome
